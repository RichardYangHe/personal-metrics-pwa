<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://esm.sh; style-src 'unsafe-inline'; connect-src https://mumcofuervklloaotpih.supabase.co https://esm.sh; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>&#x6388;&#x6743;&#x4E2A;&#x4EBA;&#x6570;&#x636E;&#x5E93;</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", system-ui, sans-serif; background: #f3f5f4; color: #17201c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 430px); background: #fff; border: 1px solid #d9dfdc; border-radius: 8px; padding: 28px; box-shadow: 0 18px 50px #17201c14; }
    .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; color: #52605a; font-size: 13px; font-weight: 700; }
    .mark { width: 16px; height: 16px; border-radius: 50%; background: #146c4a; box-shadow: inset 0 0 0 5px #dcebe4; }
    h1 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; }
    p { line-height: 1.55; color: #52605a; margin: 0 0 20px; }
    label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }
    input { width: 100%; height: 46px; border: 1px solid #bfc9c4; border-radius: 6px; padding: 0 12px; background: #f8faf9; color: #26342e; font: inherit; }
    button { width: 100%; height: 46px; margin-top: 10px; border: 0; border-radius: 6px; background: #146c4a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { background: #e9eeeb; color: #26342e; }
    button:disabled { opacity: .55; cursor: wait; }
    .scope { margin: 16px 0; padding: 13px 14px; border-radius: 6px; background: #f2f5f3; color: #33423b; font-size: 14px; line-height: 1.5; }
    .scope strong { display: block; margin-bottom: 4px; }
    #status { min-height: 22px; margin-top: 14px; color: #52605a; font-size: 14px; }
    #status.error { color: #a52b2b; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>&#x79C1;&#x6709;&#x8FDE;&#x63A5;</span></div>
    <h1>&#x8FDE;&#x63A5;&#x4E2A;&#x4EBA;&#x6570;&#x636E;&#x5E93;</h1>
    <p>&#x8FD9;&#x662F;&#x4EC5;&#x4F9B;&#x4F60;&#x4F7F;&#x7528;&#x7684;&#x79C1;&#x6709;&#x8FDE;&#x63A5;&#x3002;&#x6388;&#x6743;&#x540E;&#xFF0C;ChatGPT Work &#x548C; Codex &#x53EF;&#x4EE5;&#x67E5;&#x8BE2;&#x4F60;&#x7684;&#x4E2A;&#x4EBA;&#x8BB0;&#x5F55;&#x4E0E;&#x7ED3;&#x6784;&#x5316;&#x6307;&#x6807;&#x3002;</p>
    <section id="login">
      <label for="email">&#x6388;&#x6743;&#x90AE;&#x7BB1;</label>
      <input id="email" type="email" autocomplete="email" readonly>
      <button id="send">&#x53D1;&#x9001;&#x767B;&#x5F55;&#x90AE;&#x4EF6;</button>
    </section>
    <section id="approve" hidden>
      <div class="scope">
        <strong id="client">ChatGPT / Codex</strong>
        <span id="scopes">&#x6B63;&#x5728;&#x8BFB;&#x53D6;&#x8BF7;&#x6C42;&#x6743;&#x9650;</span><br>
        &#x5C06;&#x5141;&#x8BB8;&#x8BFB;&#x53D6;&#x4E2A;&#x4EBA;&#x8BB0;&#x5F55;&#x548C;&#x7ED3;&#x6784;&#x5316;&#x6307;&#x6807;&#x3002;&#x540E;&#x7EED;&#x4EFB;&#x4F55;&#x5199;&#x5165;&#x4ECD;&#x9700;&#x5355;&#x72EC;&#x5C55;&#x793A;&#x8349;&#x7A3F;&#x5E76;&#x7531;&#x4F60;&#x786E;&#x8BA4;&#x3002;
      </div>
      <button id="allow">&#x5141;&#x8BB8;&#x8BBF;&#x95EE;</button>
      <button id="deny" class="secondary">&#x62D2;&#x7EDD;</button>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.110.1";

    const CONFIG_URL = "https://mumcofuervklloaotpih.supabase.co/functions/v1/personal-db-mcp/oauth/config";
    const params = new URLSearchParams(location.search);
    const authId = params.get("authorization_id") || sessionStorage.getItem("mcp_authorization_id");
    const status = document.querySelector("#status");
    let sb;

    if (authId) sessionStorage.setItem("mcp_authorization_id", authId);
    const show = (text, error = false) => {
      status.textContent = text;
      status.className = error ? "error" : "";
    };

    async function session() {
      const code = params.get("code");
      if (code) {
        const result = await sb.auth.exchangeCodeForSession(code);
        if (result.error) throw result.error;
        params.delete("code");
        history.replaceState({}, "", location.pathname + "?" + params);
      }
      return (await sb.auth.getSession()).data.session;
    }

    async function ready() {
      if (!authId) {
        show("\u7f3a\u5c11\u6388\u6743\u8bf7\u6c42\uff0c\u8bf7\u4ece ChatGPT \u91cd\u65b0\u8fde\u63a5\u3002", true);
        return;
      }
      if (!await session()) return;
      const { data, error } = await sb.auth.oauth.getAuthorizationDetails(authId);
      if (error) throw error;
      if (data.redirect_url && !data.authorization_id) {
        location.assign(data.redirect_url);
        return;
      }
      document.querySelector("#client").textContent = data.client?.name || "ChatGPT / Codex";
      const scopes = String(data.scope || "").trim().split(/\s+/).filter(Boolean);
      document.querySelector("#scopes").textContent = scopes.length
        ? "\u8bf7\u6c42\u6743\u9650\uff1a" + scopes.join("\u3001")
        : "\u8bf7\u6c42\u8bbf\u95ee\u4f60\u7684\u8d26\u6237";
      document.querySelector("#login").hidden = true;
      document.querySelector("#approve").hidden = false;
      show("\u8eab\u4efd\u5df2\u9a8c\u8bc1\uff0c\u8bf7\u786e\u8ba4\u8bbf\u95ee\u6743\u9650\u3002");
    }

    document.querySelector("#send").onclick = async () => {
      const button = document.querySelector("#send");
      button.disabled = true;
      const redirect = location.origin + location.pathname + "?authorization_id=" + encodeURIComponent(authId || "");
      const { error } = await sb.auth.signInWithOtp({
        email: document.querySelector("#email").value.trim(),
        options: { emailRedirectTo: redirect, shouldCreateUser: false },
      });
      button.disabled = false;
      const sent = "\u90ae\u4ef6\u5df2\u53d1\u9001\u3002\u8bf7\u5728\u540c\u4e00\u53f0\u7535\u8111\u7684 Chrome \u4e2d\u70b9\u51fb\u90ae\u4ef6\u91cc\u7684\u767b\u5f55\u94fe\u63a5\u3002";
      show(error ? (error.message || String(error)) : sent, Boolean(error));
    };

    document.querySelector("#allow").onclick = async () => {
      const button = document.querySelector("#allow");
      button.disabled = true;
      const { data, error } = await sb.auth.oauth.approveAuthorization(authId);
      if (error) {
        button.disabled = false;
        show(error.message || String(error), true);
        return;
      }
      location.assign(data.redirect_url);
    };

    document.querySelector("#deny").onclick = async () => {
      const { data, error } = await sb.auth.oauth.denyAuthorization(authId);
      if (error) {
        show(error.message || String(error), true);
        return;
      }
      location.assign(data.redirect_url);
    };

    async function init() {
      const response = await fetch(CONFIG_URL, { cache: "no-store" });
      if (!response.ok) throw new Error("OAuth configuration is unavailable.");
      const config = await response.json();
      document.querySelector("#email").value = config.allowedEmail;
      sb = createClient(config.supabaseUrl, config.publishableKey, {
        auth: { flowType: "pkce", persistSession: true, detectSessionInUrl: false },
      });
      await ready();
    }

    init().catch((error) => show(error.message || String(error), true));
  </script>
</body>
</html>
